<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Media Navigator の状態</title>
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
<header><img src="icon48.png" alt="" width="32" height="32"><div><strong>X Media Navigator</strong><small id="version">状態確認</small></div></header>
<main>
<p id="status" role="status">診断結果を確認しています…</p>
<p class="muted" id="description"></p>
<p class="code" id="code"></p>
<button type="button" id="refresh">状態を更新</button>
<section><strong>ボタンが表示されない場合</strong>
<p>ChromeでXのプロフィールの「メディア」タブを開き、投稿画像をクリックしてください。拡張機能を再読み込みした場合、Xのタブも再読み込みしてください。</p>
<p>この診断画面は閲覧URL・投稿ID・Cookieを記録しません。</p>
</section>
</main>
</body>
</html>

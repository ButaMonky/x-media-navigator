name: TypeScript check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Required synthetic browser navigation check
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            XMN_RUN_CHROMIUM=1 CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
          elif command -v chromium >/dev/null 2>&1; then
            XMN_RUN_CHROMIUM=1 CHROMIUM_PATH="$(command -v chromium)" npm run test:browser
          else
            echo "::error::No Chrome/Chromium found: browser integration is a required quality gate."
            exit 1
          fi
      - name: Install Chrome for Testing (unpacked extension support)
        uses: browser-actions/setup-chrome@v2
        id: setup-cft
        with:
          chrome-version: stable
      - name: Required isolated Chrome MV3 B5 acceptance and security gate
        env:
          XMN_CHROME_FOR_TESTING: ${{ steps.setup-cft.outputs.chrome-path }}
        run: |
          if [ ! -x "$XMN_CHROME_FOR_TESTING" ]; then
            echo "::error::The Chrome for Testing binary is missing or non-executable."
            exit 1
          fi
          npm run test:mv3:native
          npm run test:mv3:fourphoto
          npm run test:mv3:deny
          npm run test:mv3:unverified
          npm run test:mv3:history
          npm run test:mv3:bfcache
          npm run test:mv3:reject
      - name: Verify committed compiled JS is up to date
        run: git diff --exit-code -- extension/content_script.js extension/background.js
